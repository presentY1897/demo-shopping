name: CI

on:
  pull_request:
    branches: [main]
  # `main` too, and not only for redundancy: a rebase merge rewrites the commits,
  # so the SHAs that land on `main` are never the ones a PR check ran against.
  # Without this, a direct push to `main` is tested by nothing at all.
  push:
    branches: [main]

# A new push to the same PR makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The four gates of docs/tasks/QUALITY-GATES.md, one job each so that a red
# check names the gate that broke. They are independent on purpose: each job
# runs install and the prerequisite build itself (see .github/actions/setup)
# instead of waiting on a shared build job, which keeps the wall clock at the
# slowest single job rather than the sum.
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Same gate, different tool: `pnpm lint` covers eslint for the workspace
      # packages and the root scripts, `format:check` covers prettier for the
      # whole repository.
      - run: pnpm format:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  # The suite is sharded across runners, and the three jobs below are one gate.
  #
  # It ran as a single job until 2026-09-06, and by then it took 9m18s–9m42s
  # against a ten minute cap — every package in series on one four-core runner,
  # with `apps/api` alone accounting for eight of those minutes. The first branch
  # to add a hundred tests tipped it over, and the failure arrived as
  # `cancelled`: nothing in the log said a test failed, because none had.
  #
  # Two facts decided the shape. **Coverage doubles the api suite** — 147s
  # without, 312s with, measured locally — and it cannot be dropped, because Q5
  # states coverage as a gate. And **the api suite is most of the wall clock**,
  # so splitting anything else first buys nothing.
  #
  # So `apps/api` is split three ways with `--shard`, each shard writing a blob
  # report instead of checking anything, and `test` merges the three and applies
  # the thresholds once. The merge is the only place that has seen every file;
  # a shard reads 0% for the two thirds it never loaded, which is why
  # `COVERAGE_THRESHOLDS=off` exists (`apps/api/vitest.config.mjs`).
  #
  # **`test` stays the name of the gate.** Branch protection requires four
  # checks by name and CLAUDE.md tells the next person to count them; a matrix
  # would have renamed this one to `test (1)`, `test (2)`, `test (3)` and left
  # the required check permanently pending.
  test-web:
    name: test-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Three groups rather than one job, and `--workspace-concurrency=1` inside
      # each. The first run of this shape put `apps/shop`, `apps/admin` and
      # `apps/seller` on one runner, where pnpm started all three at once and
      # each spawned its own vitest workers — four cores, a dozen processes, and
      # a cart spec failed on `findBy` while the screen still said
      # 「장바구니를 불러오는 중」. Nothing was wrong with it; it simply had not
      # been given a core within the second it waits.
      #
      # A test that fails under load is not a test that found something, and a
      # suite that has one teaches people to press re-run. One package at a time
      # per runner, and the runners are what run at once.
      matrix:
        include:
          - name: packages
            filter: --filter @shopping/shared --filter @shopping/ui --filter @shopping/api-mocks
          - name: shop
            filter: --filter @shopping/shop
          - name: consoles
            filter: --filter @shopping/admin --filter @shopping/seller
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `test:coverage`, not `test`. QUALITY-GATES Q5 states coverage as a gate
      # and `vitest run` without `--coverage` evaluates none of it. Until
      # 2026-09-04 every threshold was enforced only on the machine of whoever
      # thought to run it, which is a gate that passes without proving anything.
      #
      # **Every package needs the script, even without thresholds.**
      # `--if-present` *skips* a package that lacks it rather than falling back
      # to `test` — so the packages that had no coverage configuration were given
      # one that simply runs the suite. Without that, switching this line would
      # have quietly stopped running the shop, seller and api-mocks tests in CI,
      # which is a worse failure than the one it fixes.
      - run: >-
          pnpm ${{ matrix.filter }} --workspace-concurrency=1 -r --if-present
          run test:coverage

  test-api:
    name: test-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard failing must not cancel the other two: the merge job needs
      # their blobs to say anything useful about what else broke.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          # `apps/api/src/config/derived-env.ts` falls back to exactly these
          # three values when no `.env` exists, which is the situation in CI, so
          # DATABASE_URL comes out right with nothing set here.
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: shopping
          POSTGRES_DB: shopping
        ports:
          - '5432:5432'
        # Without a health check the first job step can win the race against
        # postgres finishing its own initdb restart.
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      # TASK-0038. One spec wants a real search engine, and the questions it asks
      # are the ones only an engine answers: does the settings body it accepted
      # make `attr_material` filterable, does the synonym list find 니트 for
      # 스웨터. A double would agree with itself and disagree with production —
      # the same argument gate A6 makes for a real database.
      #
      # Every other spec is pointed at a closed port (`testAppConfig`), so this
      # service is used by exactly one file.
      meilisearch:
        image: getmeili/meilisearch:v1.24
        env:
          MEILI_MASTER_KEY: ci-master-key
          MEILI_NO_ANALYTICS: 'true'
          MEILI_ENV: development
        ports:
          - '7700:7700'
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health || exit 1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # No migration step: the suite's global setup builds a template database,
      # runs `prisma migrate deploy` against it once and clones it per worker.
      # The command is the same one a developer runs locally.
      #
      # `--reporter=blob` writes the run to `.vitest-reports/` instead of the
      # terminal, coverage included. Three of those are what `test` merges.
      - run: >-
          pnpm --filter @shopping/api exec vitest run --coverage
          --reporter=blob --shard=${{ matrix.shard }}/3
        env:
          # A shard has only seen a third of the files; the thresholds are
          # applied once, on the merged report.
          COVERAGE_THRESHOLDS: 'off'
          # There is no `.env` in CI, so the search spec reads the key from here.
          # The host it derives itself: `scripts/ports.mjs` with no `PORT_OFFSET`
          # answers 7700, which is the port the service above publishes.
          MEILI_MASTER_KEY: ci-master-key
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: apps/api/.vitest-reports/
          retention-days: 1

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-web, test-api]
    # `always()`, so that this job runs even when a shard failed and can say so
    # itself. Without it the check would be *skipped*, and a skipped required
    # check is not a red one — the PR would look mergeable.
    if: always()
    steps:
      - name: fail when a suite did not pass
        if: needs.test-web.result != 'success' || needs.test-api.result != 'success'
        run: |
          echo "test-web=${{ needs.test-web.result }} test-api=${{ needs.test-api.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/api/.vitest-reports/
      # The gate itself. Merging three shards restores the whole file list, and
      # only then do the coverage thresholds mean what QUALITY-GATES Q5 says.
      - run: pnpm --filter @shopping/api exec vitest --merge-reports --coverage
